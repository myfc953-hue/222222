name: Build APK from Zip
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 这个就是手动Run按钮的开关

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Unzip source code
        run: unzip GnssMonitor.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enter project folder & grant permission
        run: |
          cd GnssMonitor
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd GnssMonitor
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GnssMonitor-APK
          path: GnssMonitor/app/build/outputs/apk/debug/app-debug.apk
